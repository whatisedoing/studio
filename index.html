<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF1E3">
<title>Be Curious</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E3; --ink:#2B1A1F; --burgundy:#7A1F3D; --teal:#1F5F6E; --pink:#D90F68;
    --mint:#BDEBD3; --plum:#6B2F8F; --terracotta:#B8531F; --honey:#E3A33A; --blush:#FF9DC2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;font-weight:700}
  body{min-height:100vh;min-height:100dvh;
    background:radial-gradient(circle at 90% 100%, rgba(227,163,58,.22), transparent 50%), var(--cream);
    padding-bottom:env(safe-area-inset-bottom)}

  /* rug zigzag band across the top */
  .band{height:22px;background:
    linear-gradient(135deg,var(--burgundy) 25%,transparent 25%) -11px 0,
    linear-gradient(225deg,var(--burgundy) 25%,transparent 25%) -11px 0,
    linear-gradient(315deg,var(--teal) 25%,transparent 25%),
    linear-gradient(45deg,var(--teal) 25%,transparent 25%);
    background-size:22px 22px;background-color:var(--cream)}

  .screen{display:none;min-height:calc(100vh - 22px);min-height:calc(100dvh - 22px);flex-direction:column;align-items:center;
    padding:18px 24px 36px;max-width:520px;margin:0 auto;gap:14px}
  .screen.active{display:flex}

  .logo{font-family:"Fraunces",Georgia,serif;text-align:center;line-height:1;margin:0}
  .logo .name{display:block;font-weight:900;font-size:50px;color:var(--burgundy);text-shadow:3px 3px 0 var(--blush)}
  .logo .sub{display:block;margin-top:8px;font-family:"Nunito",system-ui,sans-serif;font-weight:800;font-size:17px;
    letter-spacing:3px;text-transform:uppercase;color:var(--teal)}
  .logo.small .name{font-size:42px}

  .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .count{font-weight:800;font-size:22px;color:var(--burgundy)}

  .pill{appearance:none;font:inherit;font-weight:800;font-size:20px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:26px;
    background:#fff;border:3px solid var(--teal);color:var(--teal);text-decoration:none}
  .pill svg{flex:none}
  .pill:active{transform:scale(.97)}

  /* tiles */
  .tile{appearance:none;border:0;font:inherit;font-weight:800;font-size:22px;cursor:pointer;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
    min-height:104px;width:100%;border-radius:24px;padding:10px;transition:transform .08s}
  .tile:active{transform:translateY(3px)}
  .tile.teal{background:var(--teal);color:var(--cream);box-shadow:0 5px 0 #123C46}
  .tile.plum{background:var(--plum);color:var(--cream);box-shadow:0 5px 0 #3F1A57}
  .tile.terra{background:var(--terracotta);color:var(--cream);box-shadow:0 5px 0 #7C3510}
  .tile.honey{background:var(--honey);color:var(--ink);box-shadow:0 5px 0 #A06E12}
  .tile.burg{background:var(--burgundy);color:var(--cream);box-shadow:0 5px 0 #4A1226}
  .tile.mint{background:var(--mint);color:#1B3B33;box-shadow:0 5px 0 #7FB89C}
  .tile.pinkt{background:var(--pink);color:#fff;box-shadow:0 5px 0 #8C0A42}
  .tile.white{background:#fff;color:var(--teal);border:3px solid var(--teal);box-shadow:0 5px 0 #A9C7CD;min-height:64px;flex-direction:row;gap:12px}
  .tile .hint{font-size:16px;font-weight:700;opacity:.9}
  .tile.row{flex-direction:row;justify-content:flex-start;gap:18px;padding:0 24px;min-height:96px;text-align:left}
  .tile.row .t{display:flex;flex-direction:column;gap:2px}
  .tile.tall{min-height:170px;font-size:30px}
  .tile.tall .hint{font-size:17px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}

  /* the wide Add Item bar */
  .add-item{appearance:none;border:0;font:inherit;cursor:pointer;width:100%;min-height:104px;margin:12px 0 10px;
    border-radius:28px;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;
    background:radial-gradient(circle at 25% 20%, #FF5FA8, var(--pink) 65%);
    box-shadow:0 0 0 5px var(--cream),0 0 0 10px var(--teal),0 16px 22px rgba(122,31,61,.3);
    font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:38px;line-height:1;position:relative}
  .add-item:active{transform:scale(.97)}
  .spark{position:absolute;pointer-events:none}

  .h2{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;color:var(--burgundy);text-align:center;margin:6px 0 4px}

  /* login */
  .field{width:100%;display:flex;flex-direction:column;gap:8px}
  .field label{font-size:20px;color:var(--burgundy);font-weight:800}
  .field input{width:100%;min-height:64px;font:inherit;font-size:22px;padding:12px 16px;border-radius:16px;
    background:#fff;color:var(--ink);border:3px solid var(--teal);outline:none}
  .field input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(217,15,104,.2)}
  .pw-row{display:flex;gap:10px;width:100%}
  .pw-row input{flex:1}
  .pw-row button{min-width:72px;border-radius:16px;border:3px solid var(--teal);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .error{color:#B00039;font-weight:800;text-align:center;min-height:1.4em}
  .spacer{flex:1}

  [hidden]{display:none !important}

  /* ---------- Add Glaze wizard ---------- */
  .dots{display:flex;gap:9px;justify-content:center;width:100%;min-height:16px}
  .dots i{width:12px;height:12px;border-radius:50%;background:#E4D2BC}
  .dots i.done{background:var(--teal)}
  .dots i.cur{background:var(--pink);transform:scale(1.35)}
  .g-body{width:100%;display:flex;flex-direction:column;gap:14px;flex:1}
  .g-title{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;line-height:1.1;color:var(--burgundy);text-align:center;margin:2px 0 0}
  .g-sub{text-align:center;color:var(--teal);font-weight:700;font-size:18px;margin:0}
  .g-same{text-align:center;color:var(--plum);font-weight:800;font-size:17px;margin:0}
  .opt{appearance:none;font:inherit;font-weight:800;font-size:26px;cursor:pointer;width:100%;min-height:96px;
    border-radius:24px;background:#fff;color:var(--teal);border:3px solid var(--teal);box-shadow:0 5px 0 #A9C7CD;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
  .opt .hint{font-size:18px;font-weight:700;opacity:.85}
  .opt:active{transform:translateY(3px)}
  .opt.on,.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 5px 0 #8C0A42}
  .coat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
  .coat-grid .opt{font-size:60px;min-height:130px;font-family:"Fraunces",Georgia,serif;font-weight:900}
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .chip{appearance:none;font:inherit;font-weight:800;font-size:20px;cursor:pointer;min-height:60px;padding:0 22px;
    border-radius:30px;background:#fff;color:var(--teal);border:3px solid var(--teal);display:inline-flex;align-items:center;justify-content:center}
  .chip.dashed{border-style:dashed;background:transparent}
  .chip:active{transform:scale(.97)}
  .sw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
  .sw{appearance:none;font:inherit;font-weight:800;font-size:18px;cursor:pointer;min-height:104px;border-radius:22px;
    background:#fff;color:var(--ink);border:3px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .sw .dot{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.18)}
  .sw.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .sw.on .dot{border-color:#fff}
  .txt{width:100%;min-height:68px;font:inherit;font-size:24px;padding:12px 16px;border-radius:18px;
    border:3px solid var(--teal);background:#fff;color:var(--ink);outline:none}
  .txt:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(217,15,104,.2)}
  textarea.txt{min-height:180px;resize:none}
  .linkrow{display:block;text-align:center;font-size:20px;font-weight:800;color:var(--plum);padding:10px}
  .photo-card{background:#fff;border:3px solid var(--teal);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .photo-card h3{margin:0;font-size:22px;color:var(--burgundy)}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;min-height:84px;align-items:center}
  .thumb{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;border:3px solid var(--cream);box-shadow:0 0 0 2px #E4D2BC}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:2px;right:2px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--burgundy);font-size:24px;font-weight:900;line-height:1;cursor:pointer}
  .hint2{color:#7a6670;font-size:18px}
  .btnrow{display:flex;gap:10px}
  .btnrow .chip{flex:1;padding:0 8px;font-size:19px}
  .overlay{position:fixed;inset:0;background:rgba(251,241,227,.94);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:60;font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;color:var(--burgundy)}
  .overlay.show{display:flex}
  .done-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;margin-top:6px}
  .done-img{width:150px;height:150px;border-radius:28px;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 5px var(--teal),0 12px 20px rgba(0,0,0,.2)}
  .done-name{font-size:26px;color:var(--teal);text-align:center}

  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);
    background:#fff;border:3px solid var(--teal);color:var(--ink);font-weight:800;font-size:20px;
    padding:16px 22px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{color:var(--teal);font-size:22px;margin-top:35vh}
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<!-- =============== LOADING =============== -->
<div id="screen-loading" class="screen active"><div class="loading">Loading…</div></div>

<!-- =============== LOGIN =============== -->
<div id="screen-login" class="screen">
  <h1 class="logo"><span class="name js-name"></span><span class="sub js-sub"></span></h1>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" id="pw-toggle" aria-label="Show or hide password">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div id="login-error" class="error"></div>
  <button id="login-btn" class="tile pinkt">Log in</button>
</div>

<!-- =============== STUDIO HOME =============== -->
<div id="screen-studio" class="screen">
  <div class="top-bar">
    <button id="logout-btn" class="pill">Log out</button>
    <span id="item-count" class="count"></span>
  </div>

  <h1 class="logo small"><span class="name js-name"></span><span class="sub js-sub"></span></h1>

  <button id="add-item" class="add-item">
    <svg class="spark" style="left:12px;top:-30px" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#E3A33A"/></svg>
    <svg class="spark" style="right:20px;top:-28px" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#6B2F8F"/></svg>
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    Add Item
  </button>

  <div class="grid2">
    <button id="tile-wip" class="tile honey">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2B1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12"/><path d="M7 3c0 5 5 6 5 9s-5 4-5 9"/><path d="M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>
      Works in Progress
    </button>
    <button id="tile-done" class="tile burg">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.700 5.500 6 .9-4.400 4.200 1 6L12 16.800 6.700 19.600l1-6L3.300 9.400l6-.9z"/></svg>
      Finished Works
    </button>
    <button id="tile-glazes" class="tile teal">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 4c3 1.500 5 4.500 5 8 0 3.300-2.700 6-7 6s-7-2.700-7-6c0-3.500 2-6.500 5-8z"/></svg>
      My Glazes
    </button>
    <button id="tile-combos" class="tile plum">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
      Glaze Combos
    </button>
    <button id="tile-clay" class="tile terra">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 15c0-5 3-9 8-9s8 4 8 9c0 2-1.500 3-3 3H7c-1.500 0-3-1-3-3z"/></svg>
      Clay Bodies
    </button>
    <button id="tile-tools" class="tile mint">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1B3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.500 6.500a4 4 0 005 5L20 12l-8 8a2.100 2.100 0 01-3-3l8-8z"/><path d="M5 5l4 4"/></svg>
      Tools
    </button>
  </div>

  <button id="tile-search" class="tile white">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M16 16l5 5"/></svg>
    Search everything
  </button>
</div>

<!-- =============== ADD ITEM: what are you adding? =============== -->
<div id="screen-add" class="screen">
  <div class="top-bar">
    <button class="pill js-go-studio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back
    </button>
  </div>
  <div class="h2">What are you adding?</div>
  <button id="choose-work" class="tile row burg">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.700 5.500 6 .9-4.400 4.200 1 6L12 16.800 6.700 19.600l1-6L3.300 9.400l6-.9z"/></svg>
    <span class="t">A Work<span class="hint">A piece you're making or have made</span></span>
  </button>
  <button id="choose-glaze" class="tile row pinkt">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 4c3 1.500 5 4.500 5 8 0 3.300-2.700 6-7 6s-7-2.700-7-6c0-3.500 2-6.500 5-8z"/></svg>
    <span class="t">A Glaze<span class="hint">One glaze you own</span></span>
  </button>
  <button id="choose-combo" class="tile row plum">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
    <span class="t">A Glaze Combo<span class="hint">Two or more glazes together</span></span>
  </button>
  <button id="choose-clay" class="tile row terra">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 15c0-5 3-9 8-9s8 4 8 9c0 2-1.500 3-3 3H7c-1.500 0-3-1-3-3z"/></svg>
    <span class="t">A Clay Body<span class="hint">A clay you have</span></span>
  </button>
  <button id="choose-tool" class="tile row mint">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1B3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.500 6.500a4 4 0 005 5L20 12l-8 8a2.100 2.100 0 01-3-3l8-8z"/><path d="M5 5l4 4"/></svg>
    <span class="t">A Tool<span class="hint">Something in your studio</span></span>
  </button>
</div>

<!-- =============== ADD GLAZE (step-by-step) =============== -->
<div id="screen-glaze" class="screen">
  <div class="top-bar">
    <button id="g-back" class="pill">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back
    </button>
    <button id="g-savenow" class="pill" hidden>Save now</button>
  </div>
  <div id="g-dots" class="dots" aria-hidden="true"></div>
  <div id="g-body" class="g-body"></div>
  <button id="g-next" class="tile pinkt" style="min-height:84px;font-size:28px">Next</button>
</div>

<input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="in-lib" accept="image/*" multiple hidden>
<div id="overlay" class="overlay"><span id="overlay-text">Saving…</span></div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   SETTINGS — the only part you need to edit
   ===================================================================== */
const SUPABASE_URL = "https://prdylxlscsmsndxrwzpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_nXCSUQXO1kClzVR4l4l1kQ_pAokhVV4";
const APP_NAME = "Be Curious";
const APP_SUBTITLE = "Lauren's Studio";
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.title = APP_NAME;
document.querySelectorAll(".js-name").forEach(e => e.textContent = APP_NAME);
document.querySelectorAll(".js-sub").forEach(e => e.textContent = APP_SUBTITLE);

function show(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("screen-" + name).classList.add("active");
  window.scrollTo(0,0);
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- login ---------- */
$("pw-toggle").onclick = () => {
  const p = $("password"); p.type = p.type === "password" ? "text" : "password";
};
async function doLogin(){
  $("login-error").textContent = "";
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password){ $("login-error").textContent = "Please type your email and password."; return; }
  $("login-btn").disabled = true; $("login-btn").textContent = "Logging in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("login-btn").disabled = false; $("login-btn").textContent = "Log in";
  if(error){ $("login-error").textContent = "That didn't work. Check your email and password."; }
}
$("login-btn").onclick = doLogin;
$("password").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
$("logout-btn").onclick = async () => { await sb.auth.signOut(); };

/* ---------- navigation ---------- */
function goHome(){ show("studio"); loadCount(); }
document.querySelectorAll(".js-go-studio").forEach(b => b.onclick = goHome);
$("add-item").onclick = () => show("add");

/* ---------- studio home ---------- */
async function loadCount(){
  const { count, error } = await sb.from("studio_items").select("id", { count: "exact", head: true });
  if(error){ $("item-count").textContent = ""; console.error(error); return; }
  $("item-count").textContent = count === 1 ? "1 item" : (count || 0) + " items";
}

/* these all get built in the next steps */
const soon = () => toast("Coming soon ✨");
["tile-wip","tile-done","tile-glazes","tile-combos","tile-clay","tile-tools","tile-search",
 "choose-work","choose-combo","choose-clay","choose-tool"].forEach(id => $(id).onclick = soon);

/* =====================================================================
   ADD GLAZE — one question per screen
   ===================================================================== */
const STEPS = ["photos","name","brand","cone","application","coats","colour","texture","tags","notes"];
const CONES   = [{v:"low", t:"Low fire",  h:"Cone 05/06"}, {v:"high", t:"High fire", h:"Cone 5/6"}];
const APPS    = [{v:"dip", t:"Dip"}, {v:"spray", t:"Spray"}, {v:"other", t:"Other"}];
const COATS   = [1, 2, 3, 4];
const COLOURS = [
  ["Red","#C62828"],["Orange","#EF6C00"],["Yellow","#F9C82E"],["Green","#2E8B57"],
  ["Blue","#1F5FA8"],["Purple","#6B2F8F"],["Pink","#E8579A"],["Brown","#7B4A2A"],
  ["Grey","#8A8F98"],["Black","#1B1B1B"],["White","#F4F1EA"],["Clear","repeating-linear-gradient(45deg,#fff 0 6px,#d8e6ea 6px 12px)"]
];
const TEXTURES = ["Glossy","Satin","Matte","Speckled","Crackle","Textured"];
const STARTER_TAGS = ["Favourite","Layers well","Runs","Test again","Food safe"];
const COMMON_BRANDS = [
  {name:"Amaco", website:"https://www.amaco.com"}, {name:"Mayco", website:"https://www.maycocolors.com"},
  {name:"Spectrum", website:"https://www.spectrumglazes.com"}, {name:"Duncan", website:"https://www.duncanceramics.com"},
  {name:"Coyote", website:"https://www.coyoteclay.com"}, {name:"Laguna", website:"https://www.lagunaclay.com"}
];
const LAST_KEY = "studioLastGlaze", DRAFT_KEY = "studioGlazeDraft";

const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch(e){} };
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); });
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let G = null, RESUME = null, BRANDS = [], KNOWN_TAGS = [], brandFormOpen = false, pendingKind = "jar";

function newGlaze(){
  const last = lsGet(LAST_KEY) || {};
  const g = { id: uuid(), step: 0, photos: {jar:[], fired:[]}, name:"", brandId: last.brandId || null,
    cone: last.cone || null, application: last.application || null, applicationNote:"", coats: last.coats || null,
    colour: null, textures: [], tags: [], notes:"", itemSaved:false, same:{} };
  ["brandId","cone","application","coats"].forEach(k => { if(g[k]) g.same[k] = true; });
  return g;
}
function saveDraft(){
  if(!G || G.step === "done") return;
  const { photos, itemSaved, same, ...rest } = G;
  lsSet(DRAFT_KEY, rest);
}

async function startGlaze(){
  const draft = lsGet(DRAFT_KEY);
  G = newGlaze();
  if(draft && draft.name && draft.name.trim()){ RESUME = draft; G.step = "resume"; } else { RESUME = null; }
  brandFormOpen = false;
  show("glaze"); render();
  loadBrands(); loadTags();
}
async function loadBrands(){
  const { data, error } = await sb.from("studio_brands").select("id,name,website").order("name");
  if(error){ console.error(error); return; }
  BRANDS = data || []; if(G && STEPS[G.step] === "brand") render();
}
async function loadTags(){
  const { data, error } = await sb.from("studio_items").select("tags").eq("category","glaze");
  if(error){ console.error(error); return; }
  const n = {}; (data || []).forEach(r => (r.tags || []).forEach(t => n[t] = (n[t] || 0) + 1));
  KNOWN_TAGS = Object.keys(n).sort((a,b) => n[b] - n[a]);
  if(G && STEPS[G.step] === "tags") render();
}
function brandLink(b){
  if(b.website){ return /^https?:\/\//i.test(b.website) ? b.website : "https://" + b.website; }
  return "https://www.google.com/search?q=" + encodeURIComponent(b.name + " glaze");
}

/* ---------- drawing each screen ---------- */
function render(){
  const s = G.step;
  const name = (s === "resume" || s === "done") ? s : STEPS[s];
  const isNum = typeof s === "number";
  $("g-back").hidden = (s === "done");
  $("g-savenow").hidden = !(isNum && s >= 1 && s < STEPS.length - 1 && G.name.trim());
  $("g-dots").innerHTML = isNum ? STEPS.map((_, i) => `<i class="${i < s ? "done" : i === s ? "cur" : ""}"></i>`).join("") : "";
  const nextBtn = $("g-next");
  nextBtn.hidden = !isNum;
  if(isNum){
    if(name === "notes") nextBtn.textContent = "Save glaze";
    else nextBtn.textContent = hasValue(name) ? "Next" : (name === "name" ? "Next" : "Skip");
  }
  $("g-body").innerHTML = BODIES[name]();
  window.scrollTo(0,0);
}
function hasValue(step){
  return {photos: G.photos.jar.length + G.photos.fired.length > 0, name: !!G.name.trim(), brand: !!G.brandId, cone: !!G.cone,
    application: !!G.application, coats: !!G.coats, colour: !!G.colour, texture: G.textures.length > 0,
    tags: G.tags.length > 0, notes: !!G.notes.trim()}[step];
}
const title = (t, sub) => `<h2 class="g-title">${t}</h2>${sub ? `<p class="g-sub">${sub}</p>` : ""}`;
const sameNote = (k) => G.same[k] ? `<p class="g-same">Same as last time. Tap to keep it.</p>` : "";

function photoCard(kind, heading, hint){
  const arr = G.photos[kind];
  const thumbs = arr.length
    ? arr.map((p, i) => `<div class="thumb"><img src="${p.url}" alt=""><button data-act="rm" data-kind="${kind}" data-i="${i}" aria-label="Remove photo">×</button></div>`).join("")
    : `<span class="hint2">${hint}</span>`;
  return `<div class="photo-card"><h3>${heading}</h3><div class="thumbs">${thumbs}</div>
    <div class="btnrow"><button class="chip" data-act="cam" data-kind="${kind}">Take photo</button>
    <button class="chip" data-act="lib" data-kind="${kind}">From library</button></div></div>`;
}

const BODIES = {
  resume: () => `${title("Welcome back!", "You didn't finish this one")}
    <button class="opt" data-act="resume-yes">Continue “${esc(RESUME ? RESUME.name : "")}”</button>
    <button class="opt" data-act="resume-no">Start a new glaze</button>`,

  photos: () => `${title("Photos", "Totally optional. You can add more later.")}
    ${photoCard("jar", "The jar or a swatch", "No photo yet")}
    ${photoCard("fired", "A fired example", "No photo yet")}`,

  name: () => `${title("What's it called?")}
    <input id="g-name" class="txt" type="text" autocomplete="off" autocapitalize="words" placeholder="e.g. Celadon Blue" value="${esc(G.name)}">`,

  brand: () => {
    const sel = BRANDS.find(b => b.id === G.brandId);
    const mine = BRANDS.map(b => `<button class="chip ${G.brandId === b.id ? "on" : ""}" data-act="brand" data-id="${b.id}">${esc(b.name)}</button>`).join("");
    const have = new Set(BRANDS.map(b => b.name.toLowerCase()));
    const sug = COMMON_BRANDS.filter(b => !have.has(b.name.toLowerCase()))
      .map(b => `<button class="chip dashed" data-act="suggest" data-name="${esc(b.name)}">+ ${esc(b.name)}</button>`).join("");
    const link = sel ? `<a class="linkrow" href="${esc(brandLink(sel))}" target="_blank" rel="noopener">Visit ${esc(sel.name)}'s website ›</a>` : "";
    const form = brandFormOpen
      ? `<input id="bf-name" class="txt" type="text" autocapitalize="words" placeholder="Brand name">
         <input id="bf-site" class="txt" type="text" inputmode="url" autocapitalize="none" placeholder="Website (optional)">
         <button class="chip on" data-act="brand-save" style="min-height:64px">Add this brand</button>`
      : `<button class="chip dashed" data-act="brand-new">+ A different brand</button>`;
    return `${title("Who makes it?")}${sameNote("brandId")}
      <div class="chips">${mine}${sug}</div>${link}<div class="chips" style="flex-direction:column;align-items:stretch">${form}</div>`;
  },

  cone: () => `${title("Which firing?")}${sameNote("cone")}` +
    CONES.map(c => `<button class="opt ${G.cone === c.v ? "on" : ""}" data-act="pick" data-key="cone" data-val="${c.v}">${c.t}<span class="hint">${c.h}</span></button>`).join(""),

  application: () => `${title("How do you apply it?")}${sameNote("application")}` +
    APPS.map(a => `<button class="opt ${G.application === a.v ? "on" : ""}" data-act="pick" data-key="application" data-val="${a.v}">${a.t}</button>`).join("") +
    (G.application === "other" ? `<input id="g-appnote" class="txt" type="text" placeholder="What kind? (optional)" value="${esc(G.applicationNote)}">` : ""),

  coats: () => `${title("How many coats?")}${sameNote("coats")}
    <div class="coat-grid">${COATS.map(n => `<button class="opt ${G.coats === n ? "on" : ""}" data-act="pick" data-key="coats" data-val="${n}">${n === 4 ? "4+" : n}</button>`).join("")}</div>`,

  colour: () => `${title("What colour is it?")}
    <div class="sw-grid">${COLOURS.map(([n, c]) => `<button class="sw ${G.colour === n ? "on" : ""}" data-act="pick" data-key="colour" data-val="${n}"><span class="dot" style="background:${c}"></span>${n}</button>`).join("")}</div>`,

  texture: () => `${title("What's it like?", "Pick as many as you like")}
    <div class="chips">${TEXTURES.map(t => `<button class="chip ${G.textures.includes(t) ? "on" : ""}" data-act="multi" data-key="textures" data-val="${t}">${t}</button>`).join("")}</div>`,

  tags: () => {
    const all = [...KNOWN_TAGS, ...STARTER_TAGS.filter(t => !KNOWN_TAGS.includes(t)), ...G.tags.filter(t => !KNOWN_TAGS.includes(t) && !STARTER_TAGS.includes(t))];
    return `${title("Any tags?", "Tap to add. Make up your own below.")}
      <div class="chips">${all.map(t => `<button class="chip ${G.tags.includes(t) ? "on" : ""}" data-act="multi" data-key="tags" data-val="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <div style="display:flex;gap:10px;width:100%"><input id="g-tag" class="txt" type="text" placeholder="New tag" style="flex:1">
      <button class="chip on" data-act="addtag" style="min-height:68px">Add</button></div>`;
  },

  notes: () => `${title("Anything to remember?")}
    <textarea id="g-note" class="txt" placeholder="Notes (optional)">${esc(G.notes)}</textarea>`,

  done: () => {
    const img = G.photos.jar[0] || G.photos.fired[0];
    return `<div class="done-wrap">
      ${img ? `<img class="done-img" src="${img.url}" alt="">` : ""}
      ${title("Saved!")}<div class="done-name">${esc(G.name)}</div>
      <button class="tile pinkt" data-act="again" style="min-height:92px;font-size:28px">Add another glaze</button>
      <button class="pill" data-act="finish" style="min-height:64px;font-size:22px">All done</button></div>`;
  }
};

/* ---------- moving between screens ---------- */
function goStep(delta){ G.step += delta; brandFormOpen = false; saveDraft(); render(); }
function next(){
  const step = STEPS[G.step];
  if(step === "name" && !G.name.trim()){ toast("Please type a name first"); return; }
  if(step === "notes"){ saveGlaze(); return; }
  goStep(1);
}
$("g-next").onclick = next;
$("g-back").onclick = () => {
  if(typeof G.step !== "number" || G.step === 0){ show("add"); return; }
  goStep(-1);
};
$("g-savenow").onclick = () => saveGlaze();
$("choose-glaze").onclick = startGlaze;

/* ---------- taps inside a screen ---------- */
$("g-body").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, key = el.dataset.key, val = el.dataset.val;
  if(act === "pick"){
    G[key] = (key === "coats") ? Number(val) : val; if(G.same) G.same[key] = false;
    saveDraft(); render();
    if(!(key === "application" && val === "other")) setTimeout(() => { if(G.step !== "done") next(); }, 260);
  } else if(act === "multi"){
    const arr = G[key], i = arr.indexOf(val); if(i >= 0) arr.splice(i, 1); else arr.push(val);
    saveDraft(); render();
  } else if(act === "brand"){
    G.brandId = (G.brandId === el.dataset.id) ? null : el.dataset.id; G.same.brandId = false; saveDraft(); render();
  } else if(act === "suggest"){
    const b = COMMON_BRANDS.find(x => x.name === el.dataset.name); await addBrand(b.name, b.website);
  } else if(act === "brand-new"){
    brandFormOpen = true; render(); const f = $("bf-name"); if(f) f.focus();
  } else if(act === "brand-save"){
    const n = $("bf-name").value.trim(); if(!n){ toast("Please type the brand name"); return; }
    await addBrand(n, $("bf-site").value.trim());
  } else if(act === "addtag"){
    addTypedTag();
  } else if(act === "cam" || act === "lib"){
    pendingKind = el.dataset.kind; $(act === "cam" ? "in-cam" : "in-lib").click();
  } else if(act === "rm"){
    const arr = G.photos[el.dataset.kind]; URL.revokeObjectURL(arr[Number(el.dataset.i)].url); arr.splice(Number(el.dataset.i), 1); render();
  } else if(act === "resume-yes"){
    const { step, ...rest } = RESUME; Object.assign(G, rest); G.id = RESUME.id; G.step = (typeof step === "number" ? step : 1); G.same = {}; render();
  } else if(act === "resume-no"){
    lsDel(DRAFT_KEY); G = newGlaze(); render();
  } else if(act === "again"){
    G = newGlaze(); render();
  } else if(act === "finish"){
    goHome();
  }
});
$("g-body").addEventListener("input", (e) => {
  if(e.target.id === "g-name"){ G.name = e.target.value; $("g-savenow").hidden = !G.name.trim(); }
  else if(e.target.id === "g-note") G.notes = e.target.value;
  else if(e.target.id === "g-appnote") G.applicationNote = e.target.value;
  saveDraft();
});
$("g-body").addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  if(e.target.id === "g-name"){ e.preventDefault(); next(); }
  else if(e.target.id === "g-tag"){ e.preventDefault(); addTypedTag(); }
});
function addTypedTag(){
  const inp = $("g-tag"); const t = inp.value.trim(); if(!t) return;
  const existing = [...KNOWN_TAGS, ...STARTER_TAGS, ...G.tags].find(x => x.toLowerCase() === t.toLowerCase());
  const tag = existing || t; if(!G.tags.includes(tag)) G.tags.push(tag);
  saveDraft(); render();
}
async function addBrand(name, website){
  const found = BRANDS.find(b => b.name.toLowerCase() === name.toLowerCase());
  if(found){ G.brandId = found.id; G.same.brandId = false; brandFormOpen = false; saveDraft(); render(); return; }
  const { data, error } = await sb.from("studio_brands").insert({ name, website: website || null }).select("id,name,website").single();
  if(error){ console.error(error); toast("Couldn't add that brand. Try again."); return; }
  BRANDS.push(data); BRANDS.sort((a,b) => a.name.localeCompare(b.name));
  G.brandId = data.id; G.same.brandId = false; brandFormOpen = false; saveDraft(); render();
}

/* ---------- photos: shrink them, then keep them until saved ---------- */
async function shrink(file){
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch(e){
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
}
async function takeFiles(input){
  const files = Array.from(input.files || []); input.value = "";
  for(const f of files){
    try { const blob = await shrink(f); G.photos[pendingKind].push({ blob, url: URL.createObjectURL(blob) }); }
    catch(e){ console.error(e); toast("That photo didn't work. Try another."); }
  }
  if(STEPS[G.step] === "photos") render();
}
$("in-cam").addEventListener("change", e => takeFiles(e.target));
$("in-lib").addEventListener("change", e => takeFiles(e.target));

/* ---------- saving ---------- */
function overlay(msg){ $("overlay-text").textContent = msg || ""; $("overlay").classList.toggle("show", !!msg); }
async function saveGlaze(){
  if(!G.name.trim()){ toast("Please type a name first"); return; }
  overlay("Saving…");
  try {
    const { data: u } = await sb.auth.getUser(); const uid = u.user.id;
    if(!G.itemSaved){
      const details = { cone: G.cone, application: G.application, coats: G.coats };
      if(G.application === "other" && G.applicationNote.trim()) details.application_note = G.applicationNote.trim();
      Object.keys(details).forEach(k => details[k] == null && delete details[k]);
      const { error } = await sb.from("studio_items").insert({
        id: G.id, category: "glaze", name: G.name.trim(), brand_id: G.brandId, colour: G.colour,
        texture: G.textures.length ? G.textures.join(", ") : null, tags: G.tags, notes: G.notes.trim() || null, details });
      if(error) throw error;
      G.itemSaved = true;
    }
    let failed = 0;
    for(const kind of ["jar","fired"]){
      const keep = [];
      for(const p of G.photos[kind]){
        if(p.done){ keep.push(p); continue; }
        const path = `${uid}/${G.id}/${uuid()}.jpg`;
        const up = await sb.storage.from("studio-photos").upload(path, p.blob, { contentType: "image/jpeg" });
        let ok = !up.error;
        if(ok){ const r = await sb.from("studio_photos").insert({ item_id: G.id, kind, path }); ok = !r.error; }
        if(ok){ p.done = true; } else failed++;
        keep.push(p);
      }
      G.photos[kind] = keep;
    }
    overlay("");
    if(failed){ toast(failed + (failed === 1 ? " photo" : " photos") + " didn't upload. Tap Save again to retry."); return; }
    lsSet(LAST_KEY, { brandId: G.brandId, cone: G.cone, application: G.application, coats: G.coats });
    lsDel(DRAFT_KEY);
    G.step = "done"; render();
  } catch(err){
    console.error(err); overlay(""); toast("Couldn't save. Check your connection and try again.");
  }
}

/* ---------- start-up: keep her logged in ---------- */
function onlyIfOnLoginOrLoading(){
  return $("screen-login").classList.contains("active") || $("screen-loading").classList.contains("active");
}
sb.auth.onAuthStateChange((_event, session) => {
  if(!session) show("login");
  else if(onlyIfOnLoginOrLoading()) goHome();
});
sb.auth.getSession().then(({ data }) => {
  if(!data.session) show("login");
  else if(onlyIfOnLoginOrLoading()) goHome();
});
</script>
