<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF1E3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Be Curious">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Be Curious</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E3; --ink:#2B1A1F; --burgundy:#7A1F3D; --teal:#1F5F6E; --pink:#D90F68;
    --mint:#BDEBD3; --plum:#6B2F8F; --terracotta:#B8531F; --honey:#E3A33A; --blush:#FF9DC2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;font-weight:700}
  body{min-height:100vh;min-height:100dvh;
    background:radial-gradient(circle at 90% 100%, rgba(227,163,58,.22), transparent 50%), var(--cream);
    padding-bottom:env(safe-area-inset-bottom)}

  /* rug zigzag band across the top */
  .band{height:22px;background:
    linear-gradient(135deg,var(--burgundy) 25%,transparent 25%) -11px 0,
    linear-gradient(225deg,var(--burgundy) 25%,transparent 25%) -11px 0,
    linear-gradient(315deg,var(--teal) 25%,transparent 25%),
    linear-gradient(45deg,var(--teal) 25%,transparent 25%);
    background-size:22px 22px;background-color:var(--cream)}

  .screen{display:none;min-height:calc(100vh - 22px);min-height:calc(100dvh - 22px);flex-direction:column;align-items:center;
    padding:18px 24px 36px;max-width:520px;margin:0 auto;gap:14px}
  .screen.active{display:flex}

  .logo{font-family:"Fraunces",Georgia,serif;text-align:center;line-height:1;margin:0}
  .logo .name{display:block;font-weight:900;font-size:50px;color:var(--burgundy);text-shadow:3px 3px 0 var(--blush)}
  .logo .sub{display:block;margin-top:8px;font-family:"Nunito",system-ui,sans-serif;font-weight:800;font-size:17px;
    letter-spacing:3px;text-transform:uppercase;color:var(--teal)}
  .logo.small .name{font-size:42px}

  .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .count{font-weight:800;font-size:22px;color:var(--burgundy)}

  .pill{appearance:none;font:inherit;font-weight:800;font-size:20px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:26px;
    background:#fff;border:3px solid var(--teal);color:var(--teal);text-decoration:none}
  .pill svg{flex:none}
  .pill:active{transform:scale(.97)}

  /* tiles */
  .tile{appearance:none;border:0;font:inherit;font-weight:800;font-size:22px;cursor:pointer;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
    min-height:104px;width:100%;border-radius:24px;padding:10px;transition:transform .08s}
  .tile:active{transform:translateY(3px)}
  .tile.teal{background:var(--teal);color:var(--cream);box-shadow:0 5px 0 #123C46}
  .tile.plum{background:var(--plum);color:var(--cream);box-shadow:0 5px 0 #3F1A57}
  .tile.terra{background:var(--terracotta);color:var(--cream);box-shadow:0 5px 0 #7C3510}
  .tile.honey{background:var(--honey);color:var(--ink);box-shadow:0 5px 0 #A06E12}
  .tile.burg{background:var(--burgundy);color:var(--cream);box-shadow:0 5px 0 #4A1226}
  .tile.mint{background:var(--mint);color:#1B3B33;box-shadow:0 5px 0 #7FB89C}
  .tile.pinkt{background:var(--pink);color:#fff;box-shadow:0 5px 0 #8C0A42}
  .tile.white{background:#fff;color:var(--teal);border:3px solid var(--teal);box-shadow:0 5px 0 #A9C7CD;min-height:64px;flex-direction:row;gap:12px}
  .tile .hint{font-size:16px;font-weight:700;opacity:.9}
  .tile.row{flex-direction:row;justify-content:flex-start;gap:18px;padding:0 24px;min-height:96px;text-align:left}
  .tile.row .t{display:flex;flex-direction:column;gap:2px}
  .tile.tall{min-height:170px;font-size:30px}
  .tile.tall .hint{font-size:17px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}

  /* the wide Add Item bar */
  .add-item{appearance:none;border:0;font:inherit;cursor:pointer;width:100%;min-height:104px;margin:12px 0 10px;
    border-radius:28px;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;
    background:radial-gradient(circle at 25% 20%, #FF5FA8, var(--pink) 65%);
    box-shadow:0 0 0 5px var(--cream),0 0 0 10px var(--teal),0 16px 22px rgba(122,31,61,.3);
    font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:38px;line-height:1;position:relative}
  .add-item:active{transform:scale(.97)}
  .spark{position:absolute;pointer-events:none}

  .h2{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;color:var(--burgundy);text-align:center;margin:6px 0 4px}

  /* login */
  .field{width:100%;display:flex;flex-direction:column;gap:8px}
  .field label{font-size:20px;color:var(--burgundy);font-weight:800}
  .field input{width:100%;min-height:64px;font:inherit;font-size:22px;padding:12px 16px;border-radius:16px;
    background:#fff;color:var(--ink);border:3px solid var(--teal);outline:none}
  .field input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(217,15,104,.2)}
  .pw-row{display:flex;gap:10px;width:100%}
  .pw-row input{flex:1}
  .pw-row button{min-width:72px;border-radius:16px;border:3px solid var(--teal);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .error{color:#B00039;font-weight:800;text-align:center;min-height:1.4em}
  .spacer{flex:1}

  [hidden]{display:none !important}

  /* ---------- Add Glaze wizard ---------- */
  .dots{display:flex;gap:9px;justify-content:center;width:100%;min-height:16px}
  .dots i{width:12px;height:12px;border-radius:50%;background:#E4D2BC}
  .dots i.done{background:var(--teal)}
  .dots i.cur{background:var(--pink);transform:scale(1.35)}
  .g-body{width:100%;display:flex;flex-direction:column;gap:14px;flex:1}
  .g-title{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;line-height:1.1;color:var(--burgundy);text-align:center;margin:2px 0 0}
  .g-sub{text-align:center;color:var(--teal);font-weight:700;font-size:18px;margin:0}
  .g-same{text-align:center;color:var(--plum);font-weight:800;font-size:17px;margin:0}
  .opt{appearance:none;font:inherit;font-weight:800;font-size:26px;cursor:pointer;width:100%;min-height:96px;
    border-radius:24px;background:#fff;color:var(--teal);border:3px solid var(--teal);box-shadow:0 5px 0 #A9C7CD;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
  .opt .hint{font-size:18px;font-weight:700;opacity:.85}
  .opt:active{transform:translateY(3px)}
  .opt.on,.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 5px 0 #8C0A42}
  .coat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
  .coat-grid .opt{font-size:60px;min-height:130px;font-family:"Fraunces",Georgia,serif;font-weight:900}
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .chip{appearance:none;font:inherit;font-weight:800;font-size:20px;cursor:pointer;min-height:60px;padding:0 22px;
    border-radius:30px;background:#fff;color:var(--teal);border:3px solid var(--teal);display:inline-flex;align-items:center;justify-content:center}
  .chip.dashed{border-style:dashed;background:transparent}
  .chip:active{transform:scale(.97)}
  .sw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
  .sw{appearance:none;font:inherit;font-weight:800;font-size:18px;cursor:pointer;min-height:104px;border-radius:22px;
    background:#fff;color:var(--ink);border:3px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .sw .dot{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.18)}
  .sw.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .sw.on .dot{border-color:#fff}
  .txt{width:100%;min-height:68px;font:inherit;font-size:24px;padding:12px 16px;border-radius:18px;
    border:3px solid var(--teal);background:#fff;color:var(--ink);outline:none}
  .txt:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(217,15,104,.2)}
  textarea.txt{min-height:180px;resize:none}
  .linkrow{display:block;text-align:center;font-size:20px;font-weight:800;color:var(--plum);padding:10px}
  .photo-card{background:#fff;border:3px solid var(--teal);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .photo-card h3{margin:0;font-size:22px;color:var(--burgundy)}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;min-height:84px;align-items:center}
  .thumb{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;border:3px solid var(--cream);box-shadow:0 0 0 2px #E4D2BC}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:2px;right:2px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--burgundy);font-size:24px;font-weight:900;line-height:1;cursor:pointer}
  .hint2{color:#7a6670;font-size:18px}
  .btnrow{display:flex;gap:10px}
  .btnrow .chip{flex:1;padding:0 8px;font-size:19px}
  .overlay{position:fixed;inset:0;background:rgba(251,241,227,.94);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:60;font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:34px;color:var(--burgundy)}
  .overlay.show{display:flex}
  .done-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;margin-top:6px}
  .done-img{width:150px;height:150px;border-radius:28px;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 5px var(--teal),0 12px 20px rgba(0,0,0,.2)}
  .done-name{font-size:26px;color:var(--teal);text-align:center}

  /* ---------- My Glazes list, detail, edit ---------- */
  .gl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
  .gcard{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:0;overflow:hidden;background:#fff;color:var(--ink);
    border:3px solid var(--teal);border-radius:22px;display:flex;flex-direction:column;box-shadow:0 4px 0 #A9C7CD}
  .gcard:active{transform:translateY(3px)}
  .gcard .ph{width:100%;aspect-ratio:1;background:#EFE2D0;display:flex;align-items:center;justify-content:center;color:#9b8a8f;font-size:16px}
  .gcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .gcard .meta{padding:10px 12px 12px}
  .gcard .nm{font-weight:800;font-size:20px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gcard .sb{font-size:16px;color:#6b5a62;margin-top:4px;display:flex;align-items:center;gap:6px}
  .mini{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.2);flex:none}
  .panel{width:100%;background:#fff;border:3px solid var(--teal);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .panel h4{margin:0;font-size:18px;color:var(--burgundy)}
  .panel .chip{min-height:52px;font-size:18px;padding:0 16px}
  .chip .mini{margin-right:8px}
  .empty{text-align:center;color:#7a6670;font-size:20px;padding:30px 10px;grid-column:1 / -1}
  .d-hero{width:100%;aspect-ratio:1;border-radius:28px;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 5px var(--teal),0 12px 20px rgba(0,0,0,.18);background:#EFE2D0;display:block}
  .d-hero.ph{display:flex;align-items:center;justify-content:center;color:#9b8a8f;font-size:20px}
  .d-thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .d-thumbs button{appearance:none;border:3px solid var(--teal);border-radius:14px;padding:0;width:72px;height:72px;overflow:hidden;background:#fff;cursor:pointer}
  .d-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .d-name{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:38px;line-height:1.05;color:var(--burgundy);text-align:center;margin:8px 0 0}
  .facts{width:100%;background:#fff;border:3px solid var(--teal);border-radius:22px;padding:6px 16px}
  .fact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid #F0E3D2;font-size:20px}
  .fact:last-child{border-bottom:0}
  .fact .k{color:var(--burgundy);font-weight:800}
  .fact .v{color:var(--ink);text-align:right;display:flex;align-items:center;gap:8px}
  .notes-card{width:100%;background:#fff;border:3px solid var(--teal);border-radius:22px;padding:14px 16px;font-size:20px;line-height:1.35;white-space:pre-wrap}
  .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .badge{background:var(--mint);color:#1B3B33;border-radius:18px;padding:6px 14px;font-size:18px;font-weight:800}
  .erow{appearance:none;font:inherit;width:100%;min-height:76px;border-radius:20px;background:#fff;border:3px solid var(--teal);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px;text-align:left;cursor:pointer;box-shadow:0 4px 0 #A9C7CD}
  .erow:active{transform:translateY(3px)}
  .erow .el{font-weight:800;font-size:20px;color:var(--burgundy);flex:none}
  .erow .ev{font-size:18px;color:var(--teal);font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .lately{width:100%;margin-top:4px}
  .lately h3{margin:0 0 8px;font-size:18px;color:var(--burgundy)}
  .lately-row{display:flex;justify-content:flex-start;gap:10px}
  .lately-row button{appearance:none;border:0;background:none;font:inherit;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(25% - 8px);color:var(--ink)}
  .lately-row .lt{width:100%;aspect-ratio:1;border-radius:18px;border:3px solid #fff;box-shadow:0 3px 0 rgba(122,31,61,.25);background:#EFE2D0;overflow:hidden}
  .lately-row .lt img{width:100%;height:100%;object-fit:cover;display:block}
  .lately-row span{font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);
    background:#fff;border:3px solid var(--teal);color:var(--ink);font-weight:800;font-size:20px;
    padding:16px 22px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{color:var(--teal);font-size:22px;margin-top:35vh}
  .subhead{margin:6px 0 0;font-size:20px;color:var(--burgundy);width:100%}
  .lrows{width:100%;display:flex;flex-direction:column;gap:10px}
  .lrow{appearance:none;font:inherit;width:100%;min-height:80px;border-radius:20px;background:#fff;border:3px solid var(--teal);display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;cursor:pointer;text-align:left;color:var(--ink)}
  .lrow:active{transform:translateY(3px)}
  .lth{width:60px;height:60px;border-radius:14px;background:#EFE2D0;overflow:hidden;flex:none}
  .lth img{width:100%;height:100%;object-fit:cover;display:block}
  .ltx{flex:1;min-width:0;display:flex;flex-direction:column}
  .ln{font-weight:800;font-size:20px}.ls{font-size:16px;color:#6b5a62}
  .chev{font-size:30px;color:var(--teal);font-weight:800}
  .pickcard{position:relative}
  .pickcard.on{outline:5px solid var(--pink);outline-offset:-5px}
  .pickcard .ph{position:relative}
  .badgenum{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
  .badge.st-wip{background:var(--honey)}.badge.st-done{background:var(--mint)}
  .done-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
  .done-img{width:160px;height:160px;object-fit:cover;border-radius:20px;border:3px solid var(--teal)}
  .done-name{font-size:24px;font-weight:800;text-align:center}
  .erow .el{flex:0 1 auto;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #ls-quick .chip{padding:0 6px;min-width:0;font-size:18px}
  .addown{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .ao-col{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;font-size:20px;color:var(--burgundy);background:#fff;border:3px solid var(--teal);border-radius:20px;padding:8px 14px}
  .ao-col input{width:90px;height:52px;border:0;background:none;padding:0}
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<!-- =============== LOADING =============== -->
<div id="screen-loading" class="screen active"><div class="loading">Loading…</div></div>

<!-- =============== LOGIN =============== -->
<div id="screen-login" class="screen">
  <h1 class="logo"><span class="name js-name"></span><span class="sub js-sub"></span></h1>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" id="pw-toggle" aria-label="Show or hide password">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div id="login-error" class="error"></div>
  <button id="login-btn" class="tile pinkt">Log in</button>
</div>

<!-- =============== STUDIO HOME =============== -->
<div id="screen-studio" class="screen">
  <div class="top-bar">
    <button id="menu-btn" class="pill" aria-label="Menu" style="min-width:64px;padding:0 18px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F6E" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span id="item-count" class="count"></span>
  </div>

  <div id="menu" class="panel" hidden>
    <button id="backup-btn" class="chip" style="min-height:64px;font-size:20px">Download a backup</button>
    <button id="logout-btn" class="chip" style="min-height:64px;font-size:20px">Log out</button>
  </div>

  <h1 class="logo small"><span class="name js-name"></span><span class="sub js-sub"></span></h1>

  <button id="add-item" class="add-item">
    <svg class="spark" style="left:12px;top:-30px" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#E3A33A"/></svg>
    <svg class="spark" style="right:20px;top:-28px" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#6B2F8F"/></svg>
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    Add Item
  </button>

  <div class="grid2">
    <button id="tile-pieces" class="tile burg" style="grid-column:1 / -1;min-height:110px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBF1E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.700 5.500 6 .9-4.400 4.200 1 6L12 16.800 6.700 19.600l1-6L3.300 9.400l6-.9z"/></svg>
      Pieces
    </button>
    <button id="tile-glazes" class="tile teal">

/* ---------- login ---------- */

/* =====================================================================
   CONSTANTS

const COLOURS = [
  ["Red","#C62828"],["Orange","#EF6C00"],["Yellow","#F9C82E"],["Green","#2E8B57"],
  ["Blue","#1F5FA8"],["Purple","#6B2F8F"],["Pink","#E8579A"],["Brown","#7B4A2A"],
  ["Grey","#8A8F98"],["Black","#1B1B1B"],["White","#F4F1EA"],["Clear","repeating-linear-gradient(45deg,#fff 0 6px,#d8e6ea 6px 12px)"]
];
const TEXTURES = ["Glossy","Satin","Matte","Speckled","Crackle","Textured"];
const APPLICATIONS = [{v:"dip", t:"Dip"}, {v:"paint", t:"Paint"}, {v:"spray", t:"Spray"}, {v:"other", t:"Other"}];

const STARTER_TAGS = {
  glaze: ["Favourite","Layers well","Runs","Test again","Food safe"],
  combo: ["Favourite","Reliable","Surprising","Test again"],
  work:  ["Mug","Bowl","Plate","Vase","Planter","Gift","For sale","Experiment"],
  clay:  ["Favourite","Throws well","Handbuilding","Sculpting","Test again"],
  tool:  ["Favourite","Borrowed","Needs replacing","Wheel","Handbuilding"]
};
const COMMON_BRANDS = [
  {name:"Amaco", website:"https://www.amaco.com"}, {name:"Mayco", website:"https://www.maycocolors.com"},
  {name:"Spectrum", website:"https://www.spectrumglazes.com"}, {name:"Duncan", website:"https://www.duncanceramics.com"},
  {name:"Coyote", website:"https://www.coyoteclay.com"}, {name:"Laguna", website:"https://www.lagunaclay.com"}
];

const NOUN = { glaze: "glaze", combo: "combo", work: "piece", clay: "clay body", tool: "tool" };
const TOOL_TYPES = ["Carving","Brush","Rib","Sponge","Wire","Cutter","Stamp","Trimming","Measuring","Other"];
const CLAY_TEXTURES = ["Smooth","Grogged","Speckled","Rough"];
const isGL = (k) => k === "glaze" || k === "clay";
const texturesFor = (k) => k === "clay" ? CLAY_TEXTURES : TEXTURES;
const LAST_KEY = "studioLastGlaze", DRAFT_KEY = "studioGlazeDraft", LAST_APPLY = "studioLastApply";

let CUSTOM_HEX = {};
function rebuildCustom(){
  CUSTOM_HEX = {};
  ALL.forEach(it => { const d = it.details || {};
    if(it.colour && d.colour_hex) CUSTOM_HEX[it.colour] = d.colour_hex;
    if(d.fired_colour && d.fired_colour_hex) CUSTOM_HEX[d.fired_colour] = d.fired_colour_hex; });
}
const colourHex = (n) => (COLOURS.find(c => c[0] === n) || [])[1] || (typeof G !== "undefined" && G && G.hexes && G.hexes[n]) || CUSTOM_HEX[n] || "#ccc";
function colourOptions(){
  const names = new Set(COLOURS.map(c => c[0])), out = COLOURS.slice();
  const extra = [...Object.keys(CUSTOM_HEX), ...((typeof G !== "undefined" && G) ? [...Object.keys(G.hexes || {}), G.colour, G.firedColour] : [])];
  extra.forEach(n => { if(n && !names.has(n)){ names.add(n); out.push([n, colourHex(n)]); } });
  return out;
}
const BASE_CONES = ["low","mid","both"];
function coneOptions(kind){
  const out = (kind === "clay" ? [...CONES, {v:"both", t:"Either", h:"Works at both"}] : CONES.slice());
  const seen = new Set(BASE_CONES);
  const vals = [...ALL.filter(i => i.category === "glaze" || i.category === "clay").map(i => (i.details || {}).cone), (typeof G !== "undefined" && G) ? G.cone : null];
  vals.forEach(v => { if(v && !seen.has(v)){ seen.add(v); out.push({ v, t: v, h: "" }); } });
  return out;
}
function textureOptions(kind){
  const base = texturesFor(kind), out = base.slice();
  const vals = [...items(kind).flatMap(i => (i.texture || "").split(", ")), ...((typeof G !== "undefined" && G && G.kind === kind) ? G.textures : [])];
  vals.forEach(v => { if(v && !out.includes(v)) out.push(v); });
  return out;
}
function toolTypeOptions(){
  const out = TOOL_TYPES.slice();
  [...items("tool").map(t => (t.details || {}).type), (typeof G !== "undefined" && G) ? G.toolType : null].forEach(v => { if(v && !out.includes(v)) out.push(v); });
  return out;
}
const coneLabel = (v) => v === "both" ? "Low or mid fire" : v === "low" ? "Low fire · cone 05/06" : v === "mid" ? "Mid fire · cone 5/6" : (v || "");
const appLabel = (v) => (APPLICATIONS.find(a => a.v === v) || {}).t || "";
const photoUrl = (path) => sb.storage.from("studio-photos").getPublicUrl(path).data.publicUrl;
function brandLink(b){
  if(b.website){ return /^https?:\/\//i.test(b.website) ? b.website : "https://" + b.website; }
  return "https://www.google.com/search?q=" + encodeURIComponent(b.name + " glaze");
}

/* =====================================================================
   DATA: everything she owns, loaded in one go (it's small)
   ===================================================================== */
let ALL = [], LINKS = [], CG = [], BRANDS = [];
const items = (cat) => ALL.filter(i => i.category === cat);
const byId = (id) => ALL.find(i => i.id === id);
const photosOf = (it) => (it.studio_photos || []).slice().sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)));
function coverOf(it){
  const ps = photosOf(it);
  for(const k of ["fired","combo","main","jar"]){ const p = ps.find(x => x.kind === k); if(p) return photoUrl(p.path); }
  return ps[0] ? photoUrl(ps[0].path) : null;
}
const clayOf = (workId) => { const l = LINKS.find(l => l.item_id === workId && l.role === "clay"); return l ? l.linked_id : null; };
const linksOf = (workId) => LINKS.filter(l => l.item_id === workId && l.role !== "clay").sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
const comboGlazes = (comboId) => CG.filter(r => r.combo_id === comboId).sort((a,b) => a.layer_order - b.layer_order).map(r => r.glaze_id);
function usedIn(id){
  const combos = CG.filter(r => r.glaze_id === id).map(r => byId(r.combo_id));
  const works = LINKS.filter(l => l.linked_id === id).map(l => byId(l.item_id));
  return [...new Set([...combos, ...works].filter(Boolean))];
}
function knownLocations(){ return [...new Set(items("tool").map(t => (t.details || {}).location).filter(Boolean))]; }
function knownTags(kind){
  const n = {}; items(kind).forEach(i => (i.tags || []).forEach(t => n[t] = (n[t] || 0) + 1));
  return Object.keys(n).sort((a,b) => n[b] - n[a]);
}

async function loadAll(){
  const [a, l, c] = await Promise.all([
    sb.from("studio_items").select("id,category,name,brand_id,colour,texture,tags,notes,details,created_at,studio_photos(id,kind,path,created_at)").order("created_at", { ascending: false }),
    sb.from("studio_links").select("id,item_id,linked_id,role,application,coats,sort_order"),
    sb.from("studio_combo_glazes").select("id,combo_id,glaze_id,layer_order")
  ]);
  const err = a.error || l.error || c.error;
  if(err){ console.error(err); toast("Couldn't load: " + (err.message || "try again")); return false; }
  ALL = a.data || []; LINKS = l.data || []; CG = c.data || []; rebuildCustom();
  return true;
}
async function loadBrands(){
  const { data, error } = await sb.from("studio_brands").select("id,name,website").order("name");
  if(error){ console.error(error); return; }
  BRANDS = data || [];
  if(G && typeof G.step === "number" && stepsOf(G)[G.step] === "brand") render();
}
async function refreshAll(){
  if(await loadAll()){ renderLately(); $("item-count").textContent = ALL.length === 1 ? "1 item" : ALL.length + " items"; }
}

/* ---------- home ---------- */
function goHome(){ show("studio"); $("menu").hidden = true; refreshAll(); if(!BRANDS.length) loadBrands(); }
document.querySelectorAll(".js-go-studio").forEach(b => b.onclick = goHome);
$("add-item").onclick = () => show("add");

  const list = ALL.filter(i => coverOf(i)).slice(0, 4);
  $("lately").hidden = !list.length;
  $("lately-row").innerHTML = list.map(i => `<button data-id="${i.id}"><div class="lt"><img src="${coverOf(i)}" alt=""></div><span>${esc(i.name)}</span></button>`).join("");
}
$("lately-row").addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if(b) openDetail(b.dataset.id, { type: "studio" }); });

const soon = () => toast("Coming soon ✨");
$("tile-search").onclick = () => openSearch();
$("menu-btn").onclick = () => { $("menu").hidden = !$("menu").hidden; };
$("backup-btn").onclick = () => downloadBackup();
$("tile-glazes").onclick = () => openList("glaze");
$("tile-combos").onclick = () => openList("combo");

$("tile-clay").onclick   = () => openList("clay");

/* =====================================================================
   THE STEP-BY-STEP SCREENS (add + edit, for glazes, combos and works)
   ===================================================================== */
let G = null, RESUME = null, brandFormOpen = false, pendingKind = "jar";

function stepsOf(g){
  if(g.kind === "glaze") return ["photos","name","brand","cone","colour","firedcolour","texture","tags"];
  if(g.kind === "combo") return ["comboglazes","photos","name","tags"];
  if(g.kind === "clay") return ["photos","name","brand","cone","colour","texture","tags"];
  if(g.kind === "tool") return ["photos","name","tooltype","location","tags"];
  return ["photos","name","status","worklinks", ...g.links.map((_, i) => "apply" + i), "clay","tags"];
}
function newItem(kind){
  const last = lsGet(LAST_KEY) || {};
  const g = { kind, id: uuid(), step: 0, backTo: "add", photos: {}, name: "", nameEdited: false, brandId: null, cone: null,
    colour: null, firedColour: null, textures: [], tags: [], notes: "", cglazes: [], links: [], status: "in_progress", clayId: null, toolType: null, location: "", hexes: {},
    itemSaved: false, relDone: false, same: {}, editing: false, editReturn: false, removed: [], dirty: false, detailsBase: {} };
  PHOTO_KEYS[kind].forEach(k => g.photos[k] = []);
  if(kind === "glaze"){
    g.brandId = last.brandId || null; g.cone = (last.cone === "low" || last.cone === "mid") ? last.cone : null;
    ["brandId","cone"].forEach(k => { if(g[k]) g.same[k] = true; });
  }
  return g;
}
function saveDraft(){
  if(!G || G.step === "done") return;
  if(G.editing){ G.dirty = true; return; }
  if(G.kind !== "glaze") return;
  lsSet(DRAFT_KEY, { id: G.id, step: G.step, name: G.name, brandId: G.brandId, cone: G.cone, colour: G.colour,
    firedColour: G.firedColour, textures: G.textures, tags: G.tags, notes: G.notes, hexes: G.hexes });
}
function startNew(kind, backTo){
  const draft = kind === "glaze" ? lsGet(DRAFT_KEY) : null;
  G = newItem(kind); G.backTo = backTo || "add";
  if(draft && draft.name && draft.name.trim()){ RESUME = draft; G.step = "resume"; } else { RESUME = null; }
  brandFormOpen = false; show("glaze"); render();
  if(isGL(kind) && !BRANDS.length) loadBrands();
  loadAll().then(() => { if(G && $("screen-glaze").classList.contains("active")) render(true); });
}

/* ---------- drawing a screen ---------- */
function render(keepScroll){
  const s = G.step, steps = stepsOf(G);
  const name = (typeof s === "string") ? s : steps[s];
  const isNum = typeof s === "number";
  const nameIdx = steps.indexOf("name");
  $("g-back").hidden = (s === "done");
  $("g-savenow").hidden = !(isNum && !G.editing && s >= nameIdx && s < steps.length - 1 && G.name.trim());
  $("g-dots").innerHTML = (isNum && !G.editReturn) ? steps.map((_, i) => `<i class="${i < s ? "done" : i === s ? "cur" : ""}"></i>`).join("") : "";
  $("g-next").hidden = !isNum;
  if(isNum) $("g-next").textContent = nextLabel(name, s === steps.length - 1);
  $("g-body").innerHTML = bodyFor(name);
  if(!keepScroll) window.scrollTo(0,0);
}
function nextLabel(name, isLast){

}
function hasValue(step){

    comboglazes: true, status: true, worklinks: G.links.length > 0, clay: !!G.clayId, tooltype: !!G.toolType, location: !!G.location })[step];

      <div style="display:flex;gap:10px;width:100%"><input id="g-tag" class="txt" type="text" placeholder="New tag" style="flex:1">

  editmenu: () => {

    const T = ["tags", "Tags & notes", G.tags.length ? G.tags.join(", ") : (G.notes ? "Notes" : "")];
    let rows;
    const clayName = (byId(G.clayId) || {}).name || "";
    if(G.kind === "tool") rows = [P, ["name","Name",G.name], ["tooltype","Kind",G.toolType || ""], ["location","Kept in",G.location], T];
    else if(G.kind === "clay") rows = [P, ["name","Name",G.name], ["brand","Brand",brand ? brand.name : ""], ["cone","Firing",coneLabel(G.cone)],
      ["colour","Colour after firing",G.colour], ["texture","Texture",G.textures.join(", ")], T];
    else if(G.kind === "glaze") rows = [P, ["name","Name",G.name], ["brand","Brand",brand ? brand.name : ""], ["cone","Firing",coneLabel(G.cone)],
      ["colour","Colour in the jar",G.colour], ["firedcolour","Colour after firing",G.firedColour], ["texture","Texture",G.textures.join(", ")], T];
    else if(G.kind === "combo") rows = [["comboglazes","Glazes",G.cglazes.map(id => (byId(id) || {}).name).filter(Boolean).join(" + ")], P, ["name","Name",G.name], T];
    else rows = [P, ["name","Name",G.name], ["status","Status",G.status === "complete" ? "Finished" : "In progress"],
      ["worklinks","Glazes & combos used",G.links.map(l => (byId(l.id) || {}).name).filter(Boolean).join(", ")],
      ...G.links.map((l, i) => ["apply" + i, "How: " + ((byId(l.id) || {}).name || "?"), applySummary(l)]),

      ${rows.map(([s, l, v]) => `<button class="erow" data-act="editstep" data-step="${s}"><span class="el">${esc(l)}</span><span class="ev">${v ? esc(v) : "Not set"}</span></button>`).join("")}

function applySummary(l){ return [appLabel(l.application), l.coats ? (l.coats === 4 ? "4+" : l.coats) + (l.coats === 1 ? " coat" : " coats") : ""].filter(Boolean).join(" · "); }
function applyBody(i){
  const l = G.links[i], it = byId(l.id) || { name: "?" };
  if(!l.touched){
    const prev = i > 0 ? G.links[i - 1] : lsGet(LAST_APPLY);
    if(!l.application && !l.coats && prev && (prev.application || prev.coats)){ l.application = prev.application || null; l.coats = prev.coats || null; l.fromPrev = true; }
    l.touched = true;
  }
  const img = coverOf(it);
  return `${title(esc(it.name), "How did you use it on this piece?")}
    ${img ? `<img class="done-img" style="width:110px;height:110px;align-self:center" src="${img}" alt="">` : ""}
    ${l.fromPrev ? `<p class="g-same">Same as last time. Tap to change.</p>` : ""}
    <h4 class="subhead">Application</h4>
    <div class="chips">${APPLICATIONS.map(a => `<button class="chip ${l.application === a.v ? "on" : ""}" data-act="setlink" data-i="${i}" data-key="application" data-val="${a.v}">${a.t}</button>`).join("")}</div>
    <h4 class="subhead">Coats</h4>
    <div class="chips">${COATS.map(n => `<button class="chip ${l.coats === n ? "on" : ""}" data-act="setlink" data-i="${i}" data-key="coats" data-val="${n}">${n === 4 ? "4+" : n}</button>`).join("")}</div>`;
}
function bodyFor(name){ return name.startsWith("apply") ? applyBody(Number(name.slice(5))) : BODIES[name](); }

/* ---------- moving between screens ---------- */
function goStep(delta){ G.step += delta; brandFormOpen = false; saveDraft(); render(); }
function next(){
  const steps = stepsOf(G), step = steps[G.step];
  if(step === "name" && !G.name.trim()){ toast("Please type a name first"); return; }
  if(step === "comboglazes" && G.cglazes.length < 2){ toast("Please pick at least two glazes"); return; }
  if(G.editReturn){ G.editReturn = false; G.step = "editmenu"; render(); return; }
  if(G.step === steps.length - 1){ saveNew(); return; }
  goStep(1);
}
$("g-next").onclick = next;
$("g-savenow").onclick = () => saveNew();
$("g-back").onclick = () => {
  if(G.step === "editmenu"){
    if(G.dirty && !confirm("Leave without saving your changes?")) return;
    renderDetail(G.id); return;
  }
  if(G.editReturn){ G.editReturn = false; G.step = "editmenu"; render(); return; }
  if(typeof G.step !== "number" || G.step === 0){ leaveWizard(); return; }
  goStep(-1);
};
function leaveWizard(){ if(G.backTo === "list") openList(LIST.kind, LIST.preset); else show("add"); }

/* ---------- taps inside a screen ---------- */
$("g-body").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, key = el.dataset.key, val = el.dataset.val;
  if(act === "pick"){
    const clearing = (G[key] === val && key !== "status");
    G[key] = clearing ? null : val; if(G.same) G.same[key] = false;
    saveDraft(); render(clearing);
    if(!clearing) setTimeout(() => { if(G.step !== "done") next(); }, 260);
  } else if(act === "clearsel"){
    G[key] = null; if(G.same) G.same[key] = false; saveDraft(); render(true);
  } else if(act === "openown"){
    brandFormOpen = true; render(true); const f = $("ao-name"); if(f) f.focus();
  } else if(act === "addown"){
    const name = $("ao-name").value.trim().replace(/,/g, " ");
    if(!name){ toast("Please type a name first"); return; }
    const st = el.dataset.step; brandFormOpen = false;
    if(st === "texture"){
      const ex = textureOptions(G.kind).find(x => x.toLowerCase() === name.toLowerCase()) || name;
      if(!G.textures.includes(ex)) G.textures.push(ex);
      saveDraft(); render(true); return;
    }
    if(st === "cone"){ const ex = coneOptions(G.kind).find(c => c.t.toLowerCase() === name.toLowerCase() || c.v.toLowerCase() === name.toLowerCase()); G.cone = ex ? ex.v : name; }
    else if(st === "tooltype"){ G.toolType = toolTypeOptions().find(x => x.toLowerCase() === name.toLowerCase()) || name; }
    else {
      const ex = colourOptions().find(c => c[0].toLowerCase() === name.toLowerCase());
      const nm = ex ? ex[0] : name; if(!ex) G.hexes[nm] = $("ao-hex").value;
      if(st === "colour") G.colour = nm; else G.firedColour = nm;
    }
    saveDraft(); render();
    setTimeout(() => { if(G.step !== "done") next(); }, 260);
  } else if(act === "multi"){
    const arr = G[key], i = arr.indexOf(val); if(i >= 0) arr.splice(i, 1); else arr.push(val);
    saveDraft(); render(true);
  } else if(act === "togglepick"){
    const id = el.dataset.id;
    if(G.kind === "combo"){ const i = G.cglazes.indexOf(id); if(i >= 0) G.cglazes.splice(i, 1); else G.cglazes.push(id); }
    else { const i = G.links.findIndex(l => l.id === id); if(i >= 0) G.links.splice(i, 1); else G.links.push({ id, role: (byId(id) || {}).category || "glaze", application: null, coats: null }); }
    G.dirty = true; refreshPickBadges();
  } else if(act === "setlink"){
    const l = G.links[Number(el.dataset.i)]; const v = key === "coats" ? Number(val) : val;
    l[key] = (l[key] === v) ? null : v; l.fromPrev = false; G.dirty = true; render(true);
  } else if(act === "setloc"){
    G.location = (G.location === val) ? "" : val; G.dirty = true; render(true);
    if(G.location && !G.editReturn) setTimeout(() => { if(G.step !== "done") next(); }, 260);
  } else if(act === "addloc"){
    const t = $("g-loc").value.trim(); if(!t) return; G.location = t; G.dirty = true; render(true);
  } else if(act === "pickclay"){
    G.clayId = (G.clayId === el.dataset.id) ? null : el.dataset.id; G.dirty = true; refreshPickBadges();
    if(G.clayId && !G.editReturn) setTimeout(() => { if(G.step !== "done") next(); }, 260);
  } else if(act === "brand"){
    G.brandId = (G.brandId === el.dataset.id) ? null : el.dataset.id; G.same.brandId = false; saveDraft(); render(true);
  } else if(act === "suggest"){
    const b = COMMON_BRANDS.find(x => x.name === el.dataset.name); await addBrand(b.name, b.website);
  } else if(act === "brand-new"){
    brandFormOpen = true; render(true); const f = $("bf-name"); if(f) f.focus();
  } else if(act === "brand-save"){
    const n = $("bf-name").value.trim(); if(!n){ toast("Please type the brand name"); return; }
    await addBrand(n, $("bf-site").value.trim());
  } else if(act === "addtag"){
    addTypedTag();
  } else if(act === "cam" || act === "lib"){
    pendingKind = el.dataset.kind; $(act === "cam" ? "in-cam" : "in-lib").click();
  } else if(act === "rm"){
    const arr = G.photos[el.dataset.kind], p = arr[Number(el.dataset.i)];
    if(p.existing) G.removed.push({ id: p.id, path: p.path }); else URL.revokeObjectURL(p.url);
    arr.splice(Number(el.dataset.i), 1); G.dirty = true; render(true);
  } else if(act === "editstep"){
    G.step = stepsOf(G).indexOf(el.dataset.step); G.editReturn = true; brandFormOpen = false; render();
  } else if(act === "saveedit"){
    saveEdit();
  } else if(act === "resume-yes"){
    const { step, ...rest } = RESUME; Object.assign(G, rest); G.id = RESUME.id; G.same = {};
    G.step = (typeof step === "number" ? Math.min(step, stepsOf(G).length - 1) : 1);
    if(G.cone === "high") G.cone = "mid";
    render();
  } else if(act === "resume-no"){
    lsDel(DRAFT_KEY); const back = G.backTo; G = newItem("glaze"); G.backTo = back; render();
  } else if(act === "again"){
    const back = G.backTo, k = G.kind; G = newItem(k); G.backTo = back; render();
  } else if(act === "finish"){
    if(G.backTo === "list") openList(LIST.kind, LIST.preset); else goHome();
  }
});
function refreshPickBadges(){
  const order = pickOrder();
  document.querySelectorAll("#g-body .pickcard").forEach(c => {
    const n = order.indexOf(c.dataset.id) + 1;
    c.classList.toggle("on", !!n);
    const b = c.querySelector(".badgenum"); b.hidden = !n; b.textContent = n || "";
  });
  const steps = stepsOf(G); $("g-next").textContent = nextLabel(steps[G.step], G.step === steps.length - 1);
}
$("g-body").addEventListener("input", (e) => {
  const id = e.target.id;
  if(id === "g-name"){ G.name = e.target.value; G.nameEdited = true; $("g-savenow").hidden = !G.name.trim() || G.editing; }
  else if(id === "g-note") G.notes = e.target.value;
  else if(id === "pick-q"){
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#g-body .pickcard").forEach(c => c.style.display = (!q || c.dataset.name.includes(q)) ? "" : "none");
  }
  saveDraft();
});
$("g-body").addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  if(e.target.id === "g-name"){ e.preventDefault(); next(); }
  else if(e.target.id === "ao-name"){ e.preventDefault(); const b = document.querySelector("[data-act=addown]"); if(b) b.click(); }
  else if(e.target.id === "g-loc"){ e.preventDefault(); const t = e.target.value.trim(); if(t){ G.location = t; G.dirty = true; render(true); } }
  else if(e.target.id === "g-tag"){ e.preventDefault(); addTypedTag(); }
});
function addTypedTag(){
  const inp = $("g-tag"), t = inp.value.trim(); if(!t) return;
  const existing = [...knownTags(G.kind), ...STARTER_TAGS[G.kind], ...G.tags].find(x => x.toLowerCase() === t.toLowerCase());
  const tag = existing || t; if(!G.tags.includes(tag)) G.tags.push(tag);
  saveDraft(); render(true);
}
async function addBrand(name, website){
  const found = BRANDS.find(b => b.name.toLowerCase() === name.toLowerCase());
  if(found){ G.brandId = found.id; G.same.brandId = false; brandFormOpen = false; saveDraft(); render(true); return; }
  const { data, error } = await sb.from("studio_brands").insert({ name, website: website || null }).select("id,name,website").single();
  if(error){ console.error(error); toast("Couldn't add that brand: " + (error.message || "try again")); return; }
  BRANDS.push(data); BRANDS.sort((a,b) => a.name.localeCompare(b.name));
  G.brandId = data.id; G.same.brandId = false; brandFormOpen = false; saveDraft(); render(true);
}

/* ---------- photos ---------- */
async function shrink(file){
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch(e){ bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
}
async function takeFiles(input){
  const files = Array.from(input.files || []); input.value = "";
  for(const f of files){
    try { const blob = await shrink(f); G.photos[pendingKind].push({ blob, url: URL.createObjectURL(blob) }); G.dirty = true; }
    catch(e){ console.error(e); toast("That photo didn't work. Try another."); }
  }
  if(stepsOf(G)[G.step] === "photos") render(true);
}
$("in-cam").addEventListener("change", e => takeFiles(e.target));
$("in-lib").addEventListener("change", e => takeFiles(e.target));
async function uploadNewPhotos(uid){
  let failed = 0;
  for(const kind of Object.keys(G.photos)){
    const keep = [];
    for(const p of G.photos[kind]){
      if(p.done){ keep.push(p); continue; }
      const path = `${uid}/${G.id}/${uuid()}.jpg`;
      const up = await sb.storage.from("studio-photos").upload(path, p.blob, { contentType: "image/jpeg" });
      let ok = !up.error;
      if(ok){ const r = await sb.from("studio_photos").insert({ item_id: G.id, kind, path }); ok = !r.error; }
      if(ok){ p.done = true; } else failed++;
      keep.push(p);
    }
    G.photos[kind] = keep;
  }
  return failed;
}

/* ---------- saving ---------- */
function rowFor(g){
  const row = { name: g.name.trim(), tags: g.tags, notes: g.notes.trim() || null };
  if(isGL(g.kind)){
    const hx = (n) => (n && !COLOURS.some(c => c[0] === n)) ? colourHex(n) : null;
    const d = { ...g.detailsBase, cone: g.cone, fired_colour: g.kind === "glaze" ? g.firedColour : null,
      colour_hex: hx(g.colour), fired_colour_hex: g.kind === "glaze" ? hx(g.firedColour) : null };
    Object.keys(d).forEach(k => d[k] == null && delete d[k]);
    Object.assign(row, { brand_id: g.brandId, colour: g.colour, texture: g.textures.length ? g.textures.join(", ") : null, details: d });
  } else if(g.kind === "tool"){
    const d = { ...g.detailsBase, type: g.toolType, location: g.location || null };
    Object.keys(d).forEach(k => d[k] == null && delete d[k]);
    row.details = d;
  } else if(g.kind === "combo"){
    row.details = { ...g.detailsBase };
  } else {
    const d = { ...g.detailsBase, medium: "ceramic", status: g.status };
    if(g.clayId) delete d.clay;
    if(g.status === "complete") d.completed_at = d.completed_at || new Date().toISOString(); else delete d.completed_at;
    Object.keys(d).forEach(k => d[k] == null && delete d[k]);
    row.details = d;
  }
  return row;
}
async function writeRelations(g){
  if(g.kind === "combo"){
    let r = await sb.from("studio_combo_glazes").delete().eq("combo_id", g.id); if(r.error) throw r.error;
    if(g.cglazes.length){
      r = await sb.from("studio_combo_glazes").insert(g.cglazes.map((gid, i) => ({ combo_id: g.id, glaze_id: gid, layer_order: i + 1 })));
      if(r.error) throw r.error;
    }
  } else if(g.kind === "work"){
    let r = await sb.from("studio_links").delete().eq("item_id", g.id); if(r.error) throw r.error;
    if(g.links.length){
      r = await sb.from("studio_links").insert(g.links.map((l, i) => ({ item_id: g.id, linked_id: l.id, role: l.role, application: l.application || null, coats: l.coats || null, sort_order: i })));
      if(r.error) throw r.error;
    }
    if(g.clayId){
      r = await sb.from("studio_links").insert({ item_id: g.id, linked_id: g.clayId, role: "clay", sort_order: 99 });
      if(r.error) throw r.error;
    }
  }
}
async function saveNew(){
  if(!G.name.trim()){ toast("Please type a name first"); return; }
  overlay("Saving…");
  try {
    const { data: u } = await sb.auth.getUser(); const uid = u.user.id;
    if(!G.itemSaved){
      const { error } = await sb.from("studio_items").insert({ id: G.id, category: G.kind, ...rowFor(G) });
      if(error) throw error;
      G.itemSaved = true;
    }
    if(!G.relDone){ await writeRelations(G); G.relDone = true; }
    const failed = await uploadNewPhotos(uid);
    overlay("");
    if(failed){ toast(failed + (failed === 1 ? " photo" : " photos") + " didn't upload. Tap Save again to retry."); return; }
    if(G.kind === "glaze"){ lsSet(LAST_KEY, { brandId: G.brandId, cone: G.cone }); lsDel(DRAFT_KEY); }
    if(G.kind === "work" && G.links.length){ const l = G.links[G.links.length - 1]; lsSet(LAST_APPLY, { application: l.application, coats: l.coats }); }
    G.step = "done"; render(); refreshAll();
  } catch(err){
    console.error(err); overlay(""); toast("Couldn't save: " + ((err && err.message) || "check your connection"));
  }
}
async function saveEdit(){
  if(!G.name.trim()){ toast("Please type a name first"); return; }
  overlay("Saving…");
  try {
    const { data: u } = await sb.auth.getUser(); const uid = u.user.id;
    const { error } = await sb.from("studio_items").update({ ...rowFor(G), updated_at: new Date().toISOString() }).eq("id", G.id);
    if(error) throw error;
    await writeRelations(G);
    if(G.removed.length){
      const r = await sb.from("studio_photos").delete().in("id", G.removed.map(x => x.id)); if(r.error) throw r.error;
      await sb.storage.from("studio-photos").remove(G.removed.map(x => x.path));
      G.removed = [];
    }
    const failed = await uploadNewPhotos(uid);
    if(failed){ overlay(""); toast(failed + (failed === 1 ? " photo" : " photos") + " didn't upload. Tap Save changes to retry."); return; }
    await loadAll(); overlay(""); G.dirty = false; renderLately(); renderDetail(G.id);
  } catch(err){
    console.error(err); overlay(""); toast("Couldn't save: " + ((err && err.message) || "check your connection"));
  }
}

/* =====================================================================
   LISTS: My Glazes, Glaze Combos, Works in Progress, Finished Works
   ===================================================================== */
let LIST = { kind: "glaze", preset: null }, LF = { q: "", open: false, sel: {} };

function listTitle(){
  if(LIST.kind === "glaze") return "My Glazes";
  if(LIST.kind === "combo") return "Glaze Combos";
  return LIST.kind === "clay" ? "Clay Bodies" : LIST.kind === "tool" ? "Tools" : "Pieces";
}
async function openList(kind, preset){
  LIST = { kind, preset: preset || null }; LF = { q: "", open: false, sel: { ...(preset || {}) } };
  $("ls-title").textContent = listTitle(); $("ls-q").value = "";
  $("ls-add").textContent = "+ Add a " + (kind === "combo" ? "glaze combo" : NOUN[kind]);
  $("ls-quick").hidden = kind !== "work";
  show("list"); renderList();
  if(isGL(kind) && !BRANDS.length) loadBrands().then(renderList);
  await loadAll(); renderList();
}
function matches(it){
  const d = it.details || {}, s = LF.sel;
  if(LF.q && !it.name.toLowerCase().includes(LF.q.trim().toLowerCase())) return false;
  if(s.tag && !(it.tags || []).includes(s.tag)) return false;
  if(isGL(LIST.kind)){
    if(s.cone && d.cone !== s.cone) return false;
    if(s.colour && (d.fired_colour || it.colour) !== s.colour) return false;
    if(s.texture && !(it.texture || "").split(", ").includes(s.texture)) return false;
    if(s.brand && it.brand_id !== s.brand) return false;
  } else if(LIST.kind === "tool"){
    if(s.type && d.type !== s.type) return false;
    if(s.loc && d.location !== s.loc) return false;
  } else if(LIST.kind === "combo"){
    if(s.glaze && !comboGlazes(it.id).includes(s.glaze)) return false;
  } else {
    if(s.status && (d.status || "in_progress") !== s.status) return false;
    if(s.used && !linksOf(it.id).some(l => l.linked_id === s.used)) return false;
    if(s.clay && clayOf(it.id) !== s.clay) return false;
  }
  return true;
}
const activeFilters = () => Object.keys(LF.sel).filter(k => LF.sel[k] && !(LIST.kind === "work" && k === "status")).length;
const fchip = (key, val, label, extra) => `<button class="chip ${LF.sel[key] === val ? "on" : ""}" data-f="${key}" data-v="${esc(val)}">${extra || ""}${esc(label)}</button>`;
function panelHTML(){
  const here = items(LIST.kind);
  const tags = [...new Set(here.flatMap(i => i.tags || []))].slice(0, 16);
  const tagBlock = tags.length ? `<h4>Tags</h4><div class="chips">${tags.map(t => fchip("tag", t, t)).join("")}</div>` : "";
  if(isGL(LIST.kind)){
    const brands = BRANDS.filter(b => here.some(g => g.brand_id === b.id));
    return `<h4>Firing</h4><div class="chips">${coneOptions(LIST.kind).map(c => fchip("cone", c.v, c.v === "both" ? "Either" : c.h && c.h.startsWith("Cone ") ? c.t + " (" + c.h.replace("Cone ", "") + ")" : c.t)).join("")}</div>
      <h4>${LIST.kind === "clay" ? "Colour" : "Colour after firing"}</h4><div class="chips">${colourOptions().map(([n, c]) => fchip("colour", n, n, `<span class="mini" style="background:${c}"></span>`)).join("")}</div>
      <h4>Texture</h4><div class="chips">${textureOptions(LIST.kind).map(t => fchip("texture", t, t)).join("")}</div>
      ${brands.length ? `<h4>Brand</h4><div class="chips">${brands.map(b => fchip("brand", b.id, b.name)).join("")}</div>` : ""}${tagBlock}`;
  }
  if(LIST.kind === "tool"){
    const types = [...new Set(here.map(t => (t.details || {}).type).filter(Boolean))], locs = knownLocations();
    return `${types.length ? `<h4>Kind</h4><div class="chips">${types.map(t => fchip("type", t, t)).join("")}</div>` : ""}
      ${locs.length ? `<h4>Kept in</h4><div class="chips">${locs.map(t => fchip("loc", t, t)).join("")}</div>` : ""}${tagBlock}`;
  }
  if(LIST.kind === "combo"){
    const used = [...new Set(CG.map(r => r.glaze_id))].map(byId).filter(Boolean);
    return `${used.length ? `<h4>Made with</h4><div class="chips">${used.map(g => fchip("glaze", g.id, g.name)).join("")}</div>` : ""}${tagBlock}`;
  }
  const used = [...new Set(LINKS.filter(l => l.role !== "clay").map(l => l.linked_id))].map(byId).filter(Boolean);
  const clays = [...new Set(LINKS.filter(l => l.role === "clay").map(l => l.linked_id))].map(byId).filter(Boolean);
  return `${used.length ? `<h4>Made with</h4><div class="chips">${used.map(g => fchip("used", g.id, g.name)).join("")}</div>` : ""}
    ${clays.length ? `<h4>Clay</h4><div class="chips">${clays.map(c => fchip("clay", c.id, c.name)).join("")}</div>` : ""}${tagBlock}`;
}
function cardHTML(it){
  const d = it.details || {}, img = coverOf(it); let sub = "";
  if(isGL(it.category)){
    const col = d.fired_colour || it.colour, b = BRANDS.find(x => x.id === it.brand_id);
    sub = `${col ? `<span class="mini" style="background:${colourHex(col)}"></span>` : ""}${esc(b ? b.name : "")}`;
  } else if(it.category === "tool"){
    sub = esc(d.type || "");
  } else if(it.category === "combo"){
    const n = comboGlazes(it.id).length; sub = n + (n === 1 ? " glaze" : " glazes");
  } else {
    sub = esc(linksOf(it.id).map(l => (byId(l.linked_id) || {}).name).filter(Boolean).join(", "));
  }
  return `<button class="gcard" data-id="${it.id}"><div class="ph">${img ? `<img src="${img}" alt="" loading="lazy">` : "No photo"}</div>
    <div class="meta"><div class="nm">${esc(it.name)}</div><div class="sb">${sub}</div></div></button>`;
}
function renderList(){
  const all = items(LIST.kind), shown = all.filter(matches), n = activeFilters();
  const base = all.length;
  if(LIST.kind === "work") $("ls-quick").innerHTML = [["", "All"], ["in_progress", "In progress"], ["complete", "Finished"]].map(([v, t]) => `<button class="chip ${(LF.sel.status || "") === v ? "on" : ""}" style="flex:1" data-f="status" data-v="${v}">${t}</button>`).join("");
  const PL = { glaze: "glazes", combo: "combos", work: "pieces", clay: "clay bodies", tool: "tools" };
  $("ls-count").textContent = shown.length === base ? base + " " + (base === 1 ? NOUN[LIST.kind] : PL[LIST.kind]) : shown.length + " of " + base;
  $("ls-filter-btn").textContent = n ? `Filters (${n})` : "Filters";
  $("ls-filter-btn").classList.toggle("on", LF.open);
  $("ls-clear").hidden = !n;
  $("ls-panel").hidden = !LF.open; if(LF.open) $("ls-panel").innerHTML = panelHTML();
  const none = { glaze: "No glazes yet.", combo: "No combos yet.", work: "No pieces yet.", clay: "No clay bodies yet.", tool: "No tools yet." }[LIST.kind];
  $("ls-grid").innerHTML = shown.length ? shown.map(cardHTML).join("") : `<div class="empty">${base ? "Nothing matches those filters." : none + " Tap the pink button above to add one!"}</div>`;
}
$("screen-list").addEventListener("click", (e) => {
  const card = e.target.closest(".gcard"); if(card){ openDetail(card.dataset.id, { type: "list" }); return; }
  const f = e.target.closest("[data-f]");
  if(f){ const k = f.dataset.f, v = f.dataset.v; LF.sel[k] = (v === "" || LF.sel[k] === v) ? null : v; renderList(); return; }
  if(e.target.closest("#ls-filter-btn")){ LF.open = !LF.open; renderList(); return; }
  if(e.target.closest("#ls-clear")){ LF.sel = { ...(LIST.preset || {}) }; renderList(); return; }
  if(e.target.closest("#ls-add")) startNew(LIST.kind, "list");
});
$("ls-q").addEventListener("input", (e) => { LF.q = e.target.value; renderList(); });

/* =====================================================================
   ONE ITEM: detail page
   ===================================================================== */
let DSTACK = [], DBASE = { type: "studio" };
async function openDetail(id, base){
  DBASE = base || DBASE; DSTACK = [id];
  if(!byId(id)) await loadAll();
  if(!BRANDS.length) await loadBrands();
  renderDetail(id);
}
function renderDetail(id){
  const it = byId(id);
  if(!it){ toast("Couldn't find that one"); return; }
  if(DSTACK[DSTACK.length - 1] !== id) DSTACK[DSTACK.length ? DSTACK.length - 1 : 0] = id;
  $("d-body").innerHTML = detailHTML(it); show("detail");
}
$("d-back").onclick = () => {
  if(DSTACK.length > 1){ DSTACK.pop(); renderDetail(DSTACK[DSTACK.length - 1]); return; }
  if(DBASE.type === "list") openList(LIST.kind, LIST.preset); else if(DBASE.type === "search"){ show("search"); renderSearch(); } else goHome();
};
function lrow(it, sub){
  const img = coverOf(it);
  return `<button class="lrow" data-act="open" data-id="${it.id}"><span class="lth">${img ? `<img src="${img}" alt="">` : ""}</span>
    <span class="ltx"><span class="ln">${esc(it.name)}</span>${sub ? `<span class="ls">${esc(sub)}</span>` : ""}</span><span class="chev">›</span></button>`;
}
function detailHTML(it){
  const d = it.details || {}, b = BRANDS.find(x => x.id === it.brand_id);
  const ps = photosOf(it).map(p => ({ kind: p.kind, url: photoUrl(p.path) }));
  const first = (() => { for(const k of ["fired","combo","main","jar"]){ const p = ps.find(x => x.kind === k); if(p) return p; } return ps[0]; })();
  const hero = first ? `<img id="d-hero" class="d-hero" src="${first.url}" alt="${esc(it.name)}">` : `<div class="d-hero ph">No photo yet</div>`;
  const thumbs = ps.length > 1 ? `<div class="d-thumbs">${ps.map(p => `<button data-act="hero" data-url="${p.url}" aria-label="Show photo"><img src="${p.url}" alt=""></button>`).join("")}</div>` : "";
  const dot = (n) => n ? `<span class="mini" style="background:${colourHex(n)}"></span>${esc(n)}` : "";
  const row = (k, v) => v ? `<div class="fact"><span class="k">${k}</span><span class="v">${v}</span></div>` : "";
  const tags = (it.tags || []).length ? `<div class="badges">${it.tags.map(t => `<span class="badge">${esc(t)}</span>`).join("")}</div>` : "";
  const notes = it.notes ? `<div class="notes-card">${esc(it.notes)}</div>` : "";
  const used = usedIn(it.id);
  const usedBlock = used.length ? `<h4 class="subhead">Used in</h4><div class="lrows">${used.map(u => lrow(u, u.category === "combo" ? "Combo" : (u.details || {}).status === "complete" ? "Finished piece" : "Piece in progress")).join("")}</div>` : "";
  let mid = "", actions = "";
  if(isGL(it.category)){
    mid = `${b ? `<a class="linkrow" href="${esc(brandLink(b))}" target="_blank" rel="noopener">Visit ${esc(b.name)}'s website ›</a>` : ""}
      <div class="facts">${row("Brand", b ? esc(b.name) : "") + row("Firing", esc(coneLabel(d.cone))) + (it.category === "clay" ? row("Colour", dot(it.colour)) : row("In the jar", dot(it.colour)) + row("After firing", dot(d.fired_colour))) + row("Texture", esc(it.texture || ""))}</div>
      ${usedBlock}${tags}${notes}`;
  } else if(it.category === "tool"){
    mid = `<div class="facts">${row("Kind", esc(d.type || "")) + row("Kept in", esc(d.location || ""))}</div>${tags}${notes}`;
  } else if(it.category === "combo"){
    const layers = comboGlazes(it.id).map(byId).filter(Boolean);
    mid = `<h4 class="subhead">Layers, bottom first</h4><div class="lrows">${layers.map((g, i) => lrow(g, "Layer " + (i + 1))).join("")}</div>${usedBlock}${tags}${notes}`;
  } else {
    const done = d.status === "complete";
    const links = linksOf(it.id).map(l => ({ l, it: byId(l.linked_id) })).filter(x => x.it);
    mid = `<div class="badges"><span class="badge ${done ? "st-done" : "st-wip"}">${done ? "Finished" : "In progress"}</span></div>
      ${links.length ? `<h4 class="subhead">Made with</h4><div class="lrows">${links.map(x => lrow(x.it, applySummary(x.l))).join("")}</div>` : ""}
      ${clayOf(it.id) && byId(clayOf(it.id)) ? `<h4 class="subhead">Clay</h4><div class="lrows">${lrow(byId(clayOf(it.id)), "")}</div>` : ""}
      ${d.clay || d.completed_at ? `<div class="facts">${row("Clay", esc(d.clay || ""))}${done && d.completed_at ? row("Finished", esc(new Date(d.completed_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }))) : ""}</div>` : ""}
      ${tags}${notes}`;
    actions = done
      ? `<button class="pill" data-act="setstatus" data-id="${it.id}" data-val="in_progress" style="align-self:center">Move back to in progress</button>`
      : `<button class="tile burg" data-act="setstatus" data-id="${it.id}" data-val="complete" style="min-height:84px;font-size:26px">Mark as finished</button>`;
  }
  return `${hero}${thumbs}<h2 class="d-name">${esc(it.name)}</h2>${mid}${actions}
    <button class="tile pinkt" data-act="edit" data-id="${it.id}" style="min-height:84px;font-size:28px;margin-top:6px">Edit</button>
    <button class="pill" data-act="delete" data-id="${it.id}" style="color:#B00039;border-color:#B00039;align-self:center">Delete this ${NOUN[it.category]}</button>`;
}
$("d-body").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act === "hero"){ const h = $("d-hero"); if(h) h.src = el.dataset.url; }
  else if(act === "open"){ DSTACK.push(el.dataset.id); renderDetail(el.dataset.id); }
  else if(act === "edit") startEdit(el.dataset.id);
  else if(act === "delete") deleteItem(el.dataset.id);
  else if(act === "setstatus") setStatus(el.dataset.id, el.dataset.val);
});
async function setStatus(id, status){
  const it = byId(id); const d = { ...(it.details || {}), status };
  if(status === "complete") d.completed_at = d.completed_at || new Date().toISOString(); else delete d.completed_at;
  overlay("Saving…");
  const { error } = await sb.from("studio_items").update({ details: d, updated_at: new Date().toISOString() }).eq("id", id);
  if(error){ overlay(""); toast("Couldn't update: " + error.message); return; }
  await loadAll(); overlay(""); renderDetail(id);
  toast(status === "complete" ? "Moved to Finished!" : "Moved back to in progress");
}

/* ---------- editing ---------- */
function startEdit(id){
  const it = byId(id); if(!it) return;
  const d = it.details || {}, kind = it.category;
  G = newItem(kind);
  Object.assign(G, { id: it.id, editing: true, step: "editmenu", name: it.name, nameEdited: true, tags: [...(it.tags || [])], notes: it.notes || "",
    itemSaved: true, same: {}, detailsBase: { ...d } });
  if(kind === "tool"){ G.toolType = d.type || null; G.location = d.location || ""; }
  if(isGL(kind)) Object.assign(G, { brandId: it.brand_id, cone: d.cone || null, colour: it.colour || null, firedColour: d.fired_colour || null,
    textures: (it.texture || "").split(", ").filter(Boolean) });
  if(kind === "combo") G.cglazes = comboGlazes(it.id);
  if(kind === "work"){
    G.status = d.status || "in_progress"; G.clayId = clayOf(it.id);
    G.links = linksOf(it.id).map(l => ({ id: l.linked_id, role: l.role, application: l.application || null, coats: l.coats || null, touched: true }));
  }
  const keys = PHOTO_KEYS[kind];
  photosOf(it).forEach(p => G.photos[keys.includes(p.kind) ? p.kind : keys[0]].push({ existing: true, id: p.id, path: p.path, url: photoUrl(p.path), done: true }));
  brandFormOpen = false; show("glaze"); render();
  if(isGL(kind) && !BRANDS.length) loadBrands();
}
async function deleteItem(id){
  const it = byId(id); if(!it) return;
  const used = usedIn(id).length;
  const msg = "Delete “" + it.name + "” for good?" + (used ? "\n\nIt will also be taken out of " + used + (used === 1 ? " item" : " items") + " that use it." : "");
  if(!confirm(msg)) return;
  overlay("Deleting…");
  try {
    const paths = photosOf(it).map(p => p.path);
    if(paths.length) await sb.storage.from("studio-photos").remove(paths);
    const { error } = await sb.from("studio_items").delete().eq("id", id); if(error) throw error;
    await loadAll(); overlay(""); renderLately();
    if(DBASE.type === "list") openList(LIST.kind, LIST.preset); else goHome();
  } catch(err){
    console.error(err); overlay(""); toast("Couldn't delete: " + ((err && err.message) || "try again"));
  }
}

/* =====================================================================
   SEARCH EVERYTHING
   ===================================================================== */
const KIND_ORDER = [["work","Pieces"],["glaze","Glazes"],["combo","Glaze Combos"],["clay","Clay Bodies"],["tool","Tools"]];
function searchText(it){
  const d = it.details || {}, b = BRANDS.find(x => x.id === it.brand_id);
  const rel = it.category === "work" ? linksOf(it.id).map(l => (byId(l.linked_id) || {}).name).concat([(byId(clayOf(it.id)) || {}).name])
    : it.category === "combo" ? comboGlazes(it.id).map(id => (byId(id) || {}).name) : [];
  return [it.name, it.colour, it.texture, (it.tags || []).join(" "), it.notes, b && b.name, d.fired_colour, d.type, d.location, d.clay,
    d.cone === "low" ? "low fire cone 05 06" : d.cone === "mid" ? "mid fire cone 5 6" : "", d.status === "complete" ? "finished" : d.status === "in_progress" ? "in progress" : "", ...rel]
    .filter(Boolean).join(" ").toLowerCase();
}
async function openSearch(){
  $("sr-q").value = ""; show("search"); renderSearch();
  if(!BRANDS.length) loadBrands().then(renderSearch);
  await loadAll(); renderSearch();
}
function renderSearch(){
  const words = $("sr-q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){ $("sr-count").textContent = ""; $("sr-body").innerHTML = `<div class="empty">Type to search everything in the studio.</div>`; return; }
  const hits = ALL.filter(it => { const t = searchText(it); return words.every(w => t.includes(w)); });
  $("sr-count").textContent = hits.length + (hits.length === 1 ? " result" : " results");
  if(!hits.length){ $("sr-body").innerHTML = `<div class="empty">Nothing found. Try a different word.</div>`; return; }
  $("sr-body").innerHTML = KIND_ORDER.map(([k, label]) => {
    const list = hits.filter(i => i.category === k); if(!list.length) return "";
    return `<h4 class="subhead">${label}</h4><div class="lrows">${list.map(i => lrow(i, "")).join("")}</div>`;
  }).join("");
}
$("sr-q").addEventListener("input", renderSearch);
$("sr-body").addEventListener("click", (e) => { const b = e.target.closest("[data-act=open]"); if(b) openDetail(b.dataset.id, { type: "search" }); });

/* =====================================================================
   BACKUP: one spreadsheet (CSV) with everything
   ===================================================================== */
async function downloadBackup(){
  $("menu").hidden = true; overlay("Preparing your backup…");
  try {
    await Promise.all([loadAll(), loadBrands()]);
    const cell = (v) => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ["Type","Name","Brand","Firing","Colour (jar / clay)","Colour after firing","Texture","Kind of tool","Kept in","Status","Made with / layers","Clay","Tags","Notes","Photo links","Added"];
    const typeName = { work: "Piece", glaze: "Glaze", combo: "Glaze combo", clay: "Clay body", tool: "Tool" };
    const rows = [];
    KIND_ORDER.forEach(([k]) => items(k).slice().reverse().forEach(it => {
      const d = it.details || {}, b = BRANDS.find(x => x.id === it.brand_id);
      const madeWith = it.category === "work"
        ? linksOf(it.id).map(l => ((byId(l.linked_id) || {}).name || "?") + (applySummary(l) ? " (" + applySummary(l) + ")" : "")).join("; ")
        : it.category === "combo" ? comboGlazes(it.id).map(id => (byId(id) || {}).name).filter(Boolean).join(" + ") : "";
      rows.push([typeName[k], it.name, b ? b.name : "", coneLabel(d.cone), it.colour, d.fired_colour, it.texture, d.type, d.location,
        it.category === "work" ? (d.status === "complete" ? "Finished" : "In progress") : "", madeWith,
        it.category === "work" ? ((byId(clayOf(it.id)) || {}).name || d.clay || "") : "",
        (it.tags || []).join("; "), it.notes, photosOf(it).map(p => photoUrl(p.path)).join(" "), (it.created_at || "").slice(0, 10)]);
    }));
    const csv = "\uFEFF" + [head, ...rows].map(r => r.map(cell).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "studio-backup-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    overlay(""); toast("Backup downloaded ✨");
  } catch(err){ console.error(err); overlay(""); toast("Couldn't make the backup: " + ((err && err.message) || "try again")); }
}
